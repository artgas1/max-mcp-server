version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    # PyMax (maxapi-python) is pinned on purpose: upgrades need contract tests and a live check
    ignore:
      - dependency-name: maxapi-python
    groups:
      python:
        patterns: ["*"]
