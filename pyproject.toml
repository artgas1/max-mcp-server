[project]
name = "max-mcp-server"
dynamic = ["version"]
description = "MCP server for MAX messenger (max.ru) personal account: read chats, history, search and media from Claude, Claude Code or Cursor; read-only by default"
readme = "README.en.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "artgas1" }]
keywords = [
    "mcp", "mcp-server", "model-context-protocol", "max", "max-messenger", "max.ru", "maxru",
    "messenger", "pymax", "claude", "claude-code", "cursor", "llm", "ai-agents", "userbot",
    "chat-history", "read-only",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: English",
    "Natural Language :: Russian",
    "Typing :: Typed",
    "Environment :: Console",
]
# Верхние границы — по мажорной версии (L7, security-review): новая мажорная версия
# не придёт к пользователям PyPI без проверки. Нижние — версии без известных CVE.
dependencies = [
    "mcp>=2.3,<3",
    "maxapi-python==2.5.0",
    "aiohttp>=3.12.14,<4",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.6,<3",
    "qrcode>=8.0,<9",
    "starlette>=0.48,<2",
    "uvicorn>=0.31,<1",
]

[project.urls]
Homepage = "https://github.com/artgas1/max-mcp-server"
Repository = "https://github.com/artgas1/max-mcp-server"
Issues = "https://github.com/artgas1/max-mcp-server/issues"
Changelog = "https://github.com/artgas1/max-mcp-server/blob/main/CHANGELOG.md"
Documentation = "https://github.com/artgas1/max-mcp-server#readme"

[project.scripts]
max-mcp = "max_mcp_server.cli:main"
max-mcp-server = "max_mcp_server.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "httpx>=0.28",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/max_mcp_server/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/max_mcp_server"]

[tool.hatch.build.targets.sdist]
include = [
    "src/max_mcp_server", "tests", "docs/*.md", "pyproject.toml", "uv.lock",
    "README.md", "README.en.md", "CHANGELOG.md", "SECURITY.md", "LICENSE",
]
exclude = ["*.db", "session*.json", "*.env"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "C4", "PIE", "RET"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица в строках/комментариях
    "S101",                          # assert в тестах и инвариантах
    "ASYNC109",                      # явный timeout у login-функций — осознанно
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "PT011", "PT018", "E501", "ASYNC230", "ASYNC240"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["max_mcp_server"]
omit = ["*/max_mcp_server/__main__.py"]

[tool.coverage.report]
# порог считается по всему пакету, включая PyMaxAdapter; не покрыты в основном
# интерактивные флоу входа и probe/logout, которые без сети не проверить
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff.lint.pycodestyle]
# форматтер держит 100; длинные русские строки сообщений допускаем до 120
max-line-length = 120
