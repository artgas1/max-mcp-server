[project]
name = "max-mcp-server"
version = "0.1.0"
description = "MCP server for the MAX messenger (max.ru): read your personal chats from Claude and other LLM clients, safe by default"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "artgas1" }]
keywords = ["mcp", "mcp-server", "model-context-protocol", "max-messenger", "max.ru", "pymax", "claude", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Framework :: AsyncIO",
    "Typing :: Typed",
    "Environment :: Console",
]
dependencies = [
    "mcp>=2.3,<3",
    "maxapi-python==2.5.0",
    "aiohttp>=3.9",
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
    "qrcode>=8.0",
    "starlette>=0.48",
    "uvicorn>=0.31",
]

[project.urls]
Homepage = "https://github.com/artgas1/max-mcp-server"
Repository = "https://github.com/artgas1/max-mcp-server"
Issues = "https://github.com/artgas1/max-mcp-server/issues"
Documentation = "https://github.com/artgas1/max-mcp-server/blob/main/docs/design.md"

[project.scripts]
max-mcp = "max_mcp_server.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/max_mcp_server"]

[tool.hatch.build.targets.sdist]
include = ["src/max_mcp_server", "tests", "docs", "pyproject.toml", "README.md", "LICENSE"]
exclude = ["*.db", "session*.json", "*.env"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "C4", "PIE", "RET"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица в строках/комментариях
    "S101",                          # assert в тестах и инвариантах
    "ASYNC109",                      # явный timeout у login-функций — осознанно
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "PT011", "PT018", "E501", "ASYNC230", "ASYNC240"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff.lint.pycodestyle]
# форматтер держит 100; длинные русские строки сообщений допускаем до 120
max-line-length = 120
